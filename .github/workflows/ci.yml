name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v7
      - name: Check out the OpenHyra P0 companion
        if: matrix.python-version == '3.12'
        uses: actions/checkout@v7
        with:
          repository: MrSteeeve/OpenHyra
          ref: world-model
          path: p0-openhyra
          persist-credentials: false
      - name: Install uv and Python
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.31"
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - name: Sync locked dependencies
        run: uv sync --locked --all-extras --dev
      - name: Run test suite
        env:
          OPENHYRA_REPO: ${{ matrix.python-version == '3.12' && format('{0}/p0-openhyra', github.workspace) || '' }}
        run: uv run --frozen pytest -q
      - name: Run OpenHyra P0 selector tests
        if: matrix.python-version == '3.12'
        env:
          PYTHONPATH: p0-openhyra
        run: uv run --frozen pytest -q p0-openhyra/tests/test_stochopia_tier0_llm_selector.py

  wheel:
    name: Build and smoke-test wheel
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - name: Install uv and Python
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.31"
          python-version: "3.12"
      - name: Build distributions
        run: uv build
      - name: Install and smoke-test wheel
        run: |
          uv venv --python 3.12 .wheel-smoke
          uv pip install --python .wheel-smoke/bin/python dist/*.whl
          .wheel-smoke/bin/python -c "import stochopia.llm, stochopia.stats"
