name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v7
      - name: Install uv and Python
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.31"
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - name: Sync locked dependencies
        run: uv sync --locked --all-extras --dev
      - name: Run test suite
        run: uv run --frozen pytest -q

  wheel:
    name: Build and smoke-test wheel
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - name: Install uv and Python
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.31"
          python-version: "3.12"
      - name: Build distributions
        run: uv build
      - name: Install and smoke-test wheel
        run: |
          uv venv --python 3.12 .wheel-smoke
          uv pip install --python .wheel-smoke/bin/python dist/*.whl
          .wheel-smoke/bin/mirage-benchmark --help
          .wheel-smoke/bin/python -c "from mirage.environment import load_agent_system_prompt; assert 'action_schema' in load_agent_system_prompt()"
