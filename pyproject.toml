[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "stochopia"
version = "0.2.0"
description = "An order-flow market world model revised by an LLM research loop"
requires-python = ">=3.10"
dependencies = [
    "httpx",
    "pyyaml",
]

[project.optional-dependencies]
research = [
    "numpy",
    "torch",
    "scipy>=1.11",
]
dev = [
    "pytest",
    "pytest-asyncio",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["stochopia"]
