[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "stochopia-bench"
version = "0.2.0"
description = "A stateful environment for training trading-desk agents under uncertainty"
requires-python = ">=3.10"
dependencies = [
    "httpx",
    "pyyaml",
    "rich",
    "python-dotenv",
    "tushare",
]

[project.scripts]
stochopia-benchmark = "stochopia.benchmark_cli:main"

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["stochopia"]
